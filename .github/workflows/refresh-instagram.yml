# Download the six latest Instagram posts, rebuild, and commit the result.
#
# Add a long-lived Instagram User token as INSTAGRAM_ACCESS_TOKEN under
# Settings -> Secrets and variables -> Actions. The account must be an
# Instagram Business or Creator account and the token needs
# instagram_business_basic. See docs/INSTAGRAM.md.
#
# Media is copied into the repository because Instagram CDN links expire.
# Until the secret is set, this workflow exits successfully without changing
# the current hand-copied grid.

name: Refresh Instagram grid

on:
  schedule:
    # Daily at 07:35 UTC. Running daily also refreshes the 60-day token.
    - cron: "35 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-instagram
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -n "$INSTAGRAM_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::INSTAGRAM_ACCESS_TOKEN is not set, so the Instagram grid was left unchanged. See docs/INSTAGRAM.md."
          fi

      - name: Install image tools
        if: steps.creds.outputs.ready == 'true'
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Download the latest posts
        if: steps.creds.outputs.ready == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: v26.0
        run: python3 tools/refresh_instagram.py --refresh-token

      - name: Rebuild the site
        if: steps.creds.outputs.ready == 'true'
        run: python3 tools/build.py

      - name: Commit if anything changed
        if: steps.creds.outputs.ready == 'true'
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh Instagram grid" \
                     -m "Generated by .github/workflows/refresh-instagram.yml."
          git push

name: Validate site security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install verified build tools
        run: |
          python3 tools/bootstrap_uv.py
          .tools/uv lock --check
          .tools/uv sync --frozen
      - name: Build and run regression tests
        run: |
          sh tools/check.sh
          .tools/uv run --frozen python tools/test_instagram_processing.py
      - name: Verify pinned browser scripts
        run: node tools/test_script_integrity.cjs
      - name: Check published dependency advisories
        run: python3 tools/check_dependencies.py

# Pull the like counts out of Amplitude, rebuild, and commit the result.
#
# The site is static, so the numbers on the blog index are baked into the HTML
# at build time. This is what keeps them current: once a week it reads how many
# unique people liked each post, writes content/likes.json, rebuilds, and
# pushes. GitHub Pages redeploys from that commit.
#
# Before it can work, add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#
#   AMPLITUDE_API_KEY      the AQ Career Site project's API key
#   AMPLITUDE_SECRET_KEY   that project's SECRET key
#
# The secret key is a server credential that can read the whole project. It
# only ever belongs in a secret — never in this repo, which is public. Until
# both are set the job skips itself rather than failing every week.
#
# Run it early with Actions -> Refresh like counts -> Run workflow.

name: Refresh like counts

on:
  schedule:
    # 06:20 UTC each Monday. Off the hour on purpose: scheduled jobs queue
    # heavily on the hour and can be dropped.
    - cron: "20 6 * * 1"
  workflow_dispatch:

# Only what committing back needs.
permissions:
  contents: write

concurrency:
  group: refresh-likes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for credentials
        id: creds
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
        run: |
          if [ -n "$AMPLITUDE_API_KEY" ] && [ -n "$AMPLITUDE_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMPLITUDE_API_KEY / AMPLITUDE_SECRET_KEY are not set, so like counts were left as they are. See docs/ANALYTICS.md."
          fi

      - name: Read the counts from Amplitude
        if: steps.creds.outputs.ready == 'true'
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
          # Set the AMPLITUDE_REGION repository variable to "eu" if the project
          # is ever moved to Amplitude's EU data centre.
          AMPLITUDE_REGION: ${{ vars.AMPLITUDE_REGION || 'us' }}
        run: python3 tools/refresh_likes.py

      - name: Rebuild the site
        if: steps.creds.outputs.ready == 'true'
        run: python3 tools/build.py

      - name: Commit if anything changed
        if: steps.creds.outputs.ready == 'true'
        run: |
          if git diff --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh like counts from Amplitude" \
                     -m "Generated by .github/workflows/refresh-likes.yml."
          git push

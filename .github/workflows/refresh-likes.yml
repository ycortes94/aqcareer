# Refresh the published like totals and deploy the site without committing
# to protected main. Set Settings -> Pages -> Source to GitHub Actions.
# AMPLITUDE_API_KEY and AMPLITUDE_SECRET_KEY belong in repository secrets.
name: Refresh like counts

on:
  push:
    branches: [main]
  schedule:
    # 06:20 UTC each Monday. Off the hour on purpose: scheduled jobs queue
    # heavily on the hour and can be dropped.
    - cron: "20 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Check for credentials
        id: creds
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
        run: |
          if [ -n "$AMPLITUDE_API_KEY" ] && [ -n "$AMPLITUDE_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMPLITUDE_API_KEY / AMPLITUDE_SECRET_KEY are not set, so like counts were left as they are. See docs/ANALYTICS.md."
          fi

      - name: Read the counts from Amplitude
        if: steps.creds.outputs.ready == 'true'
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
          # Set the AMPLITUDE_REGION repository variable to "eu" if the project
          # is ever moved to Amplitude's EU data centre.
          AMPLITUDE_REGION: ${{ vars.AMPLITUDE_REGION || 'us' }}
        run: python3 tools/refresh_likes.py

      - name: Rebuild the site
        run: python3 tools/build.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage public files
        run: |
          mkdir -p _site
          cp -R assets blog post privacy _site/
          cp index.html 404.html CNAME .nojekyll feed.xml robots.txt sitemap.xml _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
